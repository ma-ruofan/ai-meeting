[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaok-meeting"
version = "0.2.0"
description = "Local-first voice meeting workspace with a bounded meeting agent"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "python-multipart>=0.0.20", "numpy>=1.26,<3", "av>=14,<19", "opencc-python-reimplemented>=0.1.7,<0.2"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2", "sherpa-onnx==1.13.7", "sherpa-onnx-core==1.13.7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["meeting_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
