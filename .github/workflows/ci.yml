name: Cross-platform checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --project backend --extra dev --extra voice --frozen
      - run: uv run --project backend --extra dev --extra voice --frozen ruff check backend scripts --config backend/pyproject.toml
      - run: uv run --project backend --extra dev --extra voice --frozen pytest backend/tests -q
      - run: uv run --project backend --extra dev --extra voice --frozen python -c "import sherpa_onnx, faster_whisper, av"
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
