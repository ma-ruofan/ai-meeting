[project]
name = "ai-meeting-assistant"
version = "0.1.0"
description = "Local-first meeting minutes and evidence-based tool-calling assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.45,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
